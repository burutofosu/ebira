name: package

on:
  push:
    branches: [main]
    paths: [".github/workflows/package.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing version to rebuild and publish (without v; uses its tag)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  package:
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Run the current workflow against the original tag when republishing.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"

      - name: Install the build toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "${{ matrix.target }}"

      - name: Check the requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          cargo +"$RUST_TOOLCHAIN" metadata --locked --no-deps --format-version 1 > metadata.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          package = next(p for p in json.loads(Path("metadata.json").read_text())["packages"] if p["name"] == "ebira")
          version = package["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit("Unsupported package version: " + version)
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              if os.environ["GITHUB_REF_NAME"] != "v" + version:
                  raise SystemExit("Tag must match Cargo.toml: v" + version)
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              if os.environ["REQUESTED_VERSION"] != version:
                  raise SystemExit("Requested version must match Cargo.toml: " + version)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("version=" + version + "\n")
          PY

      - name: Test
        run: cargo +"$RUST_TOOLCHAIN" test --locked --target "${{ matrix.target }}"

      - name: Build
        run: cargo +"$RUST_TOOLCHAIN" build --locked --release --target "${{ matrix.target }}"

      - name: Package and checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import gzip, hashlib, io, os, subprocess, tarfile, zipfile
          from pathlib import Path

          version, target = os.environ["VERSION"], os.environ["TARGET"]
          stem = f"ebira-v{version}-{target}"
          binary = "ebira.exe" if "windows" in target else "ebira"
          source = Path("target") / target / "release" / binary
          subprocess.run([str(source.resolve()), "help"], check=True)
          entries = {binary: (source.read_bytes(), 0o755)}
          for name in ("LICENSE", "README.md", "ARCHITECTURE.md"):
              entries[name] = (Path(name).read_bytes(), 0o644)
          for directory in ("skills", "examples"):
              for path in sorted(Path(directory).rglob("*")):
                  if path.is_file():
                      entries[path.as_posix()] = (path.read_bytes(), 0o644)
          rustc = subprocess.check_output(["rustc", "+" + os.environ["RUST_TOOLCHAIN"], "--version"], text=True).strip()
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"
          info = f"version: {version}\ncommit: {commit}\ntarget: {target}\ntoolchain: {rustc}\nworkflow: {os.environ['GITHUB_WORKFLOW_REF']}\nrun: {run_url}\n"
          entries["BUILD-INFO.txt"] = (info.encode(), 0o644)
          dist = Path("dist")
          dist.mkdir()
          if "windows" in target:
              archive = dist / (stem + ".zip")
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as output:
                  for name, (data, mode) in sorted(entries.items()):
                      member = zipfile.ZipInfo(stem + "/" + name, (1980, 1, 1, 0, 0, 0))
                      member.create_system = 3
                      member.external_attr = (0o100000 | mode) << 16
                      member.compress_type = zipfile.ZIP_DEFLATED
                      output.writestr(member, data)
          else:
              archive = dist / (stem + ".tar.gz")
              with archive.open("wb") as raw:
                  with gzip.GzipFile(filename="", mode="wb", fileobj=raw, mtime=0) as compressed:
                      with tarfile.open(fileobj=compressed, mode="w", format=tarfile.USTAR_FORMAT) as output:
                          for name, (data, mode) in sorted(entries.items()):
                              member = tarfile.TarInfo(stem + "/" + name)
                              member.size, member.mode, member.mtime = len(data), mode, 0
                              output.addfile(member, io.BytesIO(data))
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          (dist / (archive.name + ".sha256")).write_text(checksum + "  " + archive.name + "\n", encoding="utf-8", newline="\n")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ebira-v${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ needs.package.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: dist
    steps:
      - name: Download both distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ebira-v${{ needs.package.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Verify packages and create SHA256SUMS.txt
        run: |
          linux="ebira-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          windows="ebira-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip"
          for archive in "$linux" "$windows"; do
            test -s "$archive"
            test -s "$archive.sha256"
            sha256sum --check --strict "$archive.sha256"
          done
          sha256sum "$linux" "$windows" > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to the matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "ebira-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "ebira-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip"
            SHA256SUMS.txt
          )
          if gh release view "$RELEASE_TAG" --json id > /dev/null; then
            # Preserve the release and its notes; replace only these assets.
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "Ebira ${RELEASE_TAG#v}" --generate-notes
          fi

      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --dir published \
            --pattern "ebira-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            --pattern "ebira-${RELEASE_TAG}-x86_64-pc-windows-msvc.zip" \
            --pattern SHA256SUMS.txt
          cmp SHA256SUMS.txt published/SHA256SUMS.txt
          cd published
          sha256sum --check --strict SHA256SUMS.txt
          printf 'Published and verified [%s](%s/%s/releases/tag/%s).\n' \
            "$RELEASE_TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
